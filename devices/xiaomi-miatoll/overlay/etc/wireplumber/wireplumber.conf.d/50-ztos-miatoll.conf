# The Redmi Note 9 Pro / 9S's sound card in 16 bits. Opened by PipeWire in
# S24_LE (its default here), the speaker stays silent; in S16_LE it plays
# (tried on a joyeuse, with the TAS2562 volume fix in place).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = { update-props = { audio.format = "S16LE" } }
  }
]
